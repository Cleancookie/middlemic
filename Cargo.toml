[package]
name = "middlemic"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight mic processing chain for Windows"

[features]
# Counts heap allocations for `--profile`.
profile = []

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
# Not panic = "abort": dpdfnet.rs catches the ort panic from an old onnxruntime.dll and the device listing is joined for panics.

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ringbuf = "0.6.0"
realfft = "3.5.1"
# Also a plain dependency (eframe is Windows-only) so the drawing code can be tested headless.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
# ONNX Runtime for the DPDFNet model. The runtime is loaded from onnxruntime.dll at run time,
# so nothing links against it. No stable 2.x exists yet; rc.15 is the newest.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = { version = "0.26.1", default-features = false }
wasapi = "0.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4"] }

[profile.quick]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
